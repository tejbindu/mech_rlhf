run:
  output_dir: /scratch4/workspace/ypathak_umass_edu-pref-steer/mech_pref_artifacts

data:
  harm_category: all
  min_severity: 2
  safe_max_severity: 0

activations:
  pooling: prompt_last

steering:
  alphas: [10.0]        # single alpha for quick test
  top_k_layers: 8
  max_new_tokens: 128   # shorter responses to speed up
  n_prompts: 50         # 50 prompts ≈ ~2-3 min generation on A100

eval:
  cost_model_id: PKU-Alignment/beaver-7b-v1.0-cost
  batch_size: 4
  cost_threshold: 0.0
