[project]
name = "mech-pref"
version = "0.1.0"
description = "Mechanistic interpretability study of RLHF geometric changes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "click>=8.0",
    "datasets>=4.8.5",
    "matplotlib>=3.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    # torch and transformers are installed per-hardware by the SLURM scripts
    # (different CUDA versions require different wheel indexes which uv cannot
    # resolve across groups in a single lock file)
]

[tool.setuptools.packages.find]
include = ["mech_pref*"]
